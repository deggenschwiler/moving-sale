<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moving Sale</title>
  <meta name="description" content="Everything we're selling before we move back to the US, with photos and prices.">
  <meta property="og:title" content="Moving Sale">
  <meta property="og:description" content="Everything we're selling before we move back to the US.">
  <meta property="og:image" content="photos/IMG_1181-t.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div>
        <h1 data-i18n="title">Moving Sale</h1>
        <p class="lede" data-i18n="lede">We're moving from San Sebastián back to the US, so all of this needs a new home. Tap an item for more photos and details.</p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Category"></div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <p class="status-msg" id="msg" hidden></p>
  </main>

  <footer class="wrap site-footer">
    <p data-i18n="footer">Prices are in euros. Message me on WhatsApp about anything here.</p>
  </footer>

  <dialog id="detail" aria-labelledby="dTitle">
    <button type="button" class="close" id="dClose" aria-label="Close">&times;</button>
    <div class="gallery">
      <img id="dImg" alt="">
      <button type="button" class="nav prev" id="dPrev" aria-label="Previous photo">&#8249;</button>
      <button type="button" class="nav next" id="dNext" aria-label="Next photo">&#8250;</button>
      <div class="dots" id="dDots"></div>
    </div>
    <div class="detail-body">
      <span class="badge" id="dBadge"></span>
      <h2 id="dTitle"></h2>
      <p class="price" id="dPrice"></p>
      <div class="desc" id="dDesc"></div>
      <a class="wa" id="dWa" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.7 4.3 3.8 1.6.7 2.2.7 3 .6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
        <span data-i18n="message">Message me on WhatsApp</span>
      </a>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
